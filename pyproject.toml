[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-signal-ingest"
version = "0.1.0"
description = "Telegram signal-channel ingestion service (storage + downstream queue, no trading)"
requires-python = ">=3.12"
dependencies = [
    "telethon>=1.36,<2",
    "python-socks>=2,<3",
    "pysocks>=1.7,<2",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
tg-ingest = "tg_signal_ingest.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["tg_signal_ingest*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
